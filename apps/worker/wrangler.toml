name = "voc-radar"
main = "src/index.ts"
compatibility_date = "2026-02-25"
workers_dev = false
preview_urls = false

# 공식 Custom Domain만 이 통합 Worker에 직접 연결한다.
routes = [
  { pattern = "voc-radar.satinode.com", custom_domain = true },
]
[triggers]
crons = ["0 * * * *"]

[vars]
DETAIL_VIEW_ENABLED = "true"
# 공개 V2 read path는 migration·workflow smoke가 끝난 배포에서만 CLI로 승격한다.
REPORT_V2_ENABLED = "false"
USER_JOB_DAILY_LIMIT = "10"
API_TIMEOUT_MS = "10000"
API_RETRY_COUNT = "2"
CORS_ORIGIN = "https://voc-radar.satinode.com"

# 이 namespace ID는 Cloudflare account 전체에서 공유되므로 다른 Worker가 재사용하면 안 된다.
[[ratelimits]]
name = "APPLE_LOOKUP_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[kv_namespaces]]
binding = "CACHE_STATE"
id = "c4d4c6ad5ad147d69912f4e91061079c"

[secrets]
required = [
  "N8N_PIPELINE_TRIGGER_SECRET",
  "PIPELINE_WEBHOOK_SECRET",
  "SUPABASE_ANON_KEY",
  "SUPABASE_SERVICE_ROLE_KEY",
  "SUPABASE_URL",
]

# Worker가 실제 자산, 지원하는 SPA 경로, 알 수 없는 경로를 구분한 뒤 정적 자산을 제공한다.
# 이 경계를 건너뛰면 존재하지 않는 경로도 SPA shell과 HTTP 200을 반환한다.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = true
