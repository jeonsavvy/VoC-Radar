name = "voc-radar"
main = "src/index.ts"
compatibility_date = "2026-02-25"
workers_dev = true
preview_urls = false

# 공식 Custom Domain은 이 통합 Worker에 직접 연결한다. workers.dev도 계속 활성화해
# 기존 공유 링크가 같은 Worker와 SPA 자산을 제공하도록 유지한다.
routes = [
  { pattern = "voc-radar.satinode.com", custom_domain = true },
]
[triggers]
crons = ["0 * * * *"]

[vars]
DETAIL_VIEW_ENABLED = "true"
# 공개 V2 read path는 migration·workflow smoke가 끝난 배포에서만 CLI로 승격한다.
REPORT_V2_ENABLED = "false"
USER_JOB_DAILY_LIMIT = "10"
API_TIMEOUT_MS = "10000"
API_RETRY_COUNT = "2"
CORS_ORIGIN = "https://voc-radar.jeonsavvy.workers.dev"

# 이 namespace ID는 Cloudflare account 전체에서 공유되므로 다른 Worker가 재사용하면 안 된다.
[[ratelimits]]
name = "APPLE_LOOKUP_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[kv_namespaces]]
binding = "CACHE_STATE"
id = "c4d4c6ad5ad147d69912f4e91061079c"

[secrets]
required = [
  "PIPELINE_WEBHOOK_SECRET",
  "SUPABASE_ANON_KEY",
  "SUPABASE_SERVICE_ROLE_KEY",
  "SUPABASE_URL",
]

# Pages에서 제공하던 Vite SPA를 API와 같은 Worker에서 정적으로 제공한다.
# /api/*만 Worker 코드를 우선 실행하고 나머지 경로는 자산 또는 SPA shell로 처리한다.
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
